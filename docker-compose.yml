services:
  postgres:
    build: ./postgres

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiresense}
      POSTGRES_USER: ${POSTGRES_USER:-hiresense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  backend:
    build: ./backend

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hiresense}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hiresense}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INTERVIEWER_NAME: ${INTERVIEWER_NAME:-HireSense Interviewer}
      INTERVIEWER_EMAIL: ${INTERVIEWER_EMAIL:?Set INTERVIEWER_EMAIL in .env}
      INTERVIEWER_PASSWORD: ${INTERVIEWER_PASSWORD:?Set INTERVIEWER_PASSWORD in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      INTERVIEW_MCP_URL: http://interview-mcp:8002/mcp
      INTERVIEW_MCP_TIMEOUT_SECONDS: ${INTERVIEW_MCP_TIMEOUT_SECONDS:-120}
      INTERVIEW_COMPANY_NAME: ${INTERVIEW_COMPANY_NAME:-BJIT}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-interviews@hiresense.test}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HireSense}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      INTERVIEW_REPLY_TO_EMAIL: ${INTERVIEW_REPLY_TO_EMAIL:-interviews@hiresense.test}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
      CV_MAX_FILE_SIZE_MB: ${CV_MAX_FILE_SIZE_MB:-10}
      CV_MAX_PAGES: ${CV_MAX_PAGES:-40}
      CV_MAX_CHARACTERS: ${CV_MAX_CHARACTERS:-150000}
      CV_MIN_EXTRACT_CHARACTERS: ${CV_MIN_EXTRACT_CHARACTERS:-80}
      SCREENING_BATCH_MAX_APPLICATIONS: ${SCREENING_BATCH_MAX_APPLICATIONS:-50}
      KNOWLEDGE_PDF_MAX_FILE_SIZE_MB: ${KNOWLEDGE_PDF_MAX_FILE_SIZE_MB:-15}
      KNOWLEDGE_PDF_MAX_PAGES: ${KNOWLEDGE_PDF_MAX_PAGES:-100}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_DOCKER_SERVICE_ACCOUNT_FILE:-/app/secrets/google-service-account.json}
      GOOGLE_FORM_URL: ${GOOGLE_FORM_URL:-https://docs.google.com/forms/d/e/1FAIpQLSfMduzyxs15tGH8LpoVSV6Nqs_0S3udgPQ83n6mQZmY4w_OIg/viewform}
      GOOGLE_FORMS_SPREADSHEET_ID: ${GOOGLE_FORMS_SPREADSHEET_ID:-}
      GOOGLE_FORMS_SHEET_NAME: ${GOOGLE_FORMS_SHEET_NAME:-Form Responses 1}
      GOOGLE_FORMS_TIMESTAMP_COLUMN: ${GOOGLE_FORMS_TIMESTAMP_COLUMN:-Timestamp}
      GOOGLE_FORMS_NAME_COLUMN: ${GOOGLE_FORMS_NAME_COLUMN:-Name}
      GOOGLE_FORMS_EMAIL_COLUMN: ${GOOGLE_FORMS_EMAIL_COLUMN:-Email Address}
      GOOGLE_FORMS_PHONE_COLUMN: ${GOOGLE_FORMS_PHONE_COLUMN:-Phone}
      GOOGLE_FORMS_LINKEDIN_COLUMN: ${GOOGLE_FORMS_LINKEDIN_COLUMN:-LinkedIn}
      GOOGLE_FORMS_PORTFOLIO_COLUMN: ${GOOGLE_FORMS_PORTFOLIO_COLUMN:-Portfolio}
      GOOGLE_FORMS_LOCATION_COLUMN: ${GOOGLE_FORMS_LOCATION_COLUMN:-Location}
      GOOGLE_FORMS_CV_COLUMN: ${GOOGLE_FORMS_CV_COLUMN:-Upload CV}
      GOOGLE_FORMS_JOB_COLUMN: ${GOOGLE_FORMS_JOB_COLUMN:-Job Posting}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      JOB_POSTING_MCP_URL: http://job-posting-mcp:8001/mcp
      JOB_POSTING_MCP_TIMEOUT_SECONDS: ${JOB_POSTING_MCP_TIMEOUT_SECONDS:-30}
      DISCORD_DEFAULT_HEADING: ${DISCORD_DEFAULT_HEADING:-BJIT is Hiring!}
      JOB_POST_DEFAULT_APPLICATION_URL: ${JOB_POST_DEFAULT_APPLICATION_URL:-}
      JOB_POST_DEFAULT_CONTACT_EMAIL: ${JOB_POST_DEFAULT_CONTACT_EMAIL:-}
      JOB_POST_DEFAULT_LOCATION: ${JOB_POST_DEFAULT_LOCATION:-}
      JOB_POST_DEFAULT_APPLICATION_DEADLINE: ${JOB_POST_DEFAULT_APPLICATION_DEADLINE:-}
      JOB_POST_DEFAULT_INSTRUCTIONS: ${JOB_POST_DEFAULT_INSTRUCTIONS:-}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend/storage:/app/storage
      - ./backend/secrets:/app/secrets:ro

    depends_on:
      postgres:
        condition: service_healthy
      job-posting-mcp:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    restart: unless-stopped

  job-posting-mcp:
    build: ./backend

    command:
      - python
      - -m
      - app.job_posting_mcp.server

    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_API_BASE_URL: ${DISCORD_API_BASE_URL:-https://discord.com/api/v10}
      DISCORD_BOT_TIMEOUT_SECONDS: ${DISCORD_BOT_TIMEOUT_SECONDS:-15}

    expose:
      - "8001"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('localhost', 8001), 3); connection.close()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  interview-mcp:
    build: ./backend
    command: ["python", "-m", "app.interview_mcp.server"]
    environment:
      INTERVIEW_BACKEND_URL: http://backend:8000
    expose: ["8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail-test"]
    ports:
      - "127.0.0.1:8025:8025"
    expose: ["1025"]

  frontend:
    build: ./frontend

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
