services:
  postgres:
    image: postgres:16-alpine

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiresense}
      POSTGRES_USER: ${POSTGRES_USER:-hiresense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  backend:
    build: ./backend

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hiresense}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hiresense}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INTERVIEWER_NAME: ${INTERVIEWER_NAME:-HireSense Interviewer}
      INTERVIEWER_EMAIL: ${INTERVIEWER_EMAIL:?Set INTERVIEWER_EMAIL in .env}
      INTERVIEWER_PASSWORD: ${INTERVIEWER_PASSWORD:?Set INTERVIEWER_PASSWORD in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
      CV_MAX_FILE_SIZE_MB: ${CV_MAX_FILE_SIZE_MB:-10}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - private_storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    restart: unless-stopped

  frontend:
    build: ./frontend

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
  private_storage:
