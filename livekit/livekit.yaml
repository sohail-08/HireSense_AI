# Local development. Production must advertise a reachable IP and use trusted TLS.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
room:
  auto_create: false
  max_participants: 2
  empty_timeout: 300
  departure_timeout: 120
logging:
  level: warn
  pion_level: error
# Credentials are injected via LIVEKIT_KEYS, never committed in this file.
